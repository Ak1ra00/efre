[package]
name = "efre"
description = "efre — offline vault that opens only with your YubiKey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Dev-only: run the app against the deterministic mock authenticator.
# A release build with this feature fails to compile (efre-authn/src/mock.rs).
dev-mock = ["efre-authn/mock"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
efre-core.workspace = true
efre-authn.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
secrecy.workspace = true
thiserror.workspace = true
arboard.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  # clipboard.rs: sequence number, check-and-clear, exclusion formats
  "Win32_System_DataExchange",
  # system_events.rs: suspend callback, session notifications, hidden window
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_LibraryLoader", # also hardening.rs: SetDefaultDllDirectories
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", # WNDCLASSEXW / RegisterClassExW
  # GetSystemWindowsDirectoryW: launch Explorer by full path ("Open vault folder").
  "Win32_System_SystemInformation",
  # hardening.rs (ARCHITECTURE §8.1): error mode, WER exclusion, WEBVIEW2_* variables,
  # image-load mitigation policy. Threading also gives platform.rs CREATE_DEFAULT_ERROR_MODE.
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ErrorReporting",
  "Win32_System_Environment",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
# The WebView2 settings Tauri doesn't expose: browser accelerator keys and the default
# context menu (print, save as). Already in the graph through tauri/wry: same version.
webview2-com = "0.39"

[target.'cfg(not(windows))'.dependencies]
# clipboard.rs development fallback: "still ours" = same SHA-256 of the clipboard text.
sha2.workspace = true

[dev-dependencies]
# Command-layer tests drive efre-core with the mock authenticator. Dev-only: normal and
# release builds never compile the mock (see ARCHITECTURE §11).
efre-authn = { workspace = true, features = ["mock"] }

[lints]
workspace = true
