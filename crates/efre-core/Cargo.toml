[package]
name = "efre-core"
description = "efre vault format, key hierarchy and encrypted storage (platform-independent)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
efre-authn.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
sha2.workspace = true
hmac.workspace = true
rand.workspace = true
zeroize.workspace = true
secrecy.workspace = true
subtle.workspace = true
rusqlite.workspace = true
minicbor.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# VirtualLock / VirtualUnlock for the key page (ARCHITECTURE §5.9).
windows = { workspace = true, features = ["Win32_System_Memory"] }

[dev-dependencies]
# The mock authenticator is only ever compiled for tests (see ARCHITECTURE §11).
efre-authn = { workspace = true, features = ["mock"] }
proptest.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# examples/hardware_check.rs: parent window for the Windows Security dialog.
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
