<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
  <title id="t">How efre opens your vault</title>
  <desc id="d">Your YubiKey, after its PIN and a touch, gives Windows Security a secret. efre's Rust core uses it to unwrap the vault key and decrypt vault.efre, which stays on this PC. The window shows titles; a secret reaches it only when you click Reveal. Nothing goes to the network.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93ff"/>
    </marker>
    <style>
      .h { font: 600 20px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #ececf1; }
      .sub { font: 400 13px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #a3a6b0; }
      .nt { font: 600 15px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #ececf1; }
      .nl { font: 400 12.5px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #a3a6b0; }
      .al { font: 500 11.5px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #a7adff; }
      .warn { font: 500 12.5px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #f2bb4f; }
      .ok { font: 500 12.5px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #4fd18f; }
      .node { fill: #17181d; stroke: #30333a; stroke-width: 1; }
      .core { fill: #17181d; stroke: #8b93ff; stroke-width: 1.5; }
      .wire { stroke: #8b93ff; stroke-width: 1.5; fill: none; }
      .icon { stroke: #a7adff; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" rx="14" fill="#0c0d10" stroke="#25272d"/>

  <text class="h" x="40" y="48">How efre opens your vault</text>
  <text class="sub" x="40" y="72">No master password. Only an enrolled YubiKey, its PIN and a touch.</text>

  <!-- 1. YubiKey -->
  <rect class="node" x="40" y="104" width="170" height="118" rx="10"/>
  <g class="icon" transform="translate(58 122)">
    <rect x="0" y="4" width="26" height="14" rx="4"/>
    <rect x="26" y="7" width="6" height="8" rx="1"/>
    <circle cx="9" cy="11" r="3"/>
  </g>
  <text class="nt" x="58" y="166">Your YubiKey</text>
  <text class="nl" x="58" y="188">PIN or fingerprint</text>
  <text class="nl" x="58" y="206">+ a touch</text>

  <!-- 2. Windows Security -->
  <rect class="node" x="256" y="104" width="170" height="118" rx="10"/>
  <g class="icon" transform="translate(274 122)">
    <path d="M11 2 L21 6 V12 C21 18 16 21 11 23 C6 21 1 18 1 12 V6 Z"/>
    <path d="M7 12 L10 15 L15 9"/>
  </g>
  <text class="nt" x="274" y="166">Windows Security</text>
  <text class="nl" x="274" y="188">webauthn.dll asks for</text>
  <text class="nl" x="274" y="206">the PIN and the touch</text>

  <!-- 3. efre core -->
  <rect class="core" x="472" y="104" width="170" height="118" rx="10"/>
  <g class="icon" transform="translate(490 122)">
    <rect x="2" y="10" width="18" height="13" rx="3"/>
    <path d="M6 10 V7 A5 5 0 0 1 16 7 V10"/>
  </g>
  <text class="nt" x="490" y="166">efre core (Rust)</text>
  <text class="nl" x="490" y="188">unwraps the vault key,</text>
  <text class="nl" x="490" y="206">decrypts your items</text>

  <!-- 4. vault file -->
  <rect class="node" x="688" y="104" width="152" height="118" rx="10"/>
  <g class="icon" transform="translate(706 122)">
    <path d="M3 1 H14 L20 7 V23 H3 Z"/>
    <path d="M14 1 V7 H20"/>
  </g>
  <text class="nt" x="706" y="166">vault.efre</text>
  <text class="nl" x="706" y="188">encrypted, kept</text>
  <text class="nl" x="706" y="206">on this PC only</text>

  <!-- arrows along the top row -->
  <path class="wire" d="M210 163 H250" marker-end="url(#arrow)"/>
  <path class="wire" d="M426 163 H466" marker-end="url(#arrow)"/>
  <path class="wire" d="M642 163 H682" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="al" x="230" y="153" text-anchor="middle">secret</text>
  <text class="al" x="446" y="153" text-anchor="middle">secret</text>

  <!-- 5. window -->
  <path class="wire" d="M557 222 V286" marker-end="url(#arrow)"/>
  <text class="al" x="566" y="258">titles; a secret only</text>
  <text class="al" x="566" y="273">when you click Reveal</text>
  <rect class="node" x="472" y="292" width="368" height="72" rx="10"/>
  <g class="icon" transform="translate(490 309)">
    <rect x="0" y="1" width="24" height="18" rx="3"/>
    <path d="M0 6 H24"/>
  </g>
  <text class="nt" x="526" y="322">efre window</text>
  <text class="nl" x="526" y="344">Copying happens in the core, never in the window.</text>

  <!-- footer notes -->
  <g transform="translate(40 300)">
    <rect x="0" y="0" width="386" height="28" rx="14" fill="rgb(79 209 143 / 0.12)"/>
    <text class="ok" x="16" y="19">No network: nothing ever leaves this PC.</text>
    <rect x="0" y="36" width="386" height="28" rx="14" fill="rgb(242 187 79 / 0.12)"/>
    <text class="warn" x="16" y="55">Lose every enrolled key and the vault stays closed.</text>
  </g>
</svg>
