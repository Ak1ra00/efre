name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
jobs:
  frontend:
    name: Frontend (tsc, eslint, vitest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Audit shipped npm dependencies
        run: npm audit --omit=dev --audit-level=low
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, test, mock exclusion)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # src-tauri embeds dist/ at compile time.
      - run: npm ci
      - run: npm run build
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Release builds cannot include the mock authenticator
        shell: bash
        run: |
          set -euo pipefail
          # 1. Enabling the mock in a release build must be a compile error.
          if cargo build --release --locked -p efre-authn --features mock 2> mock-release.log; then
            echo "::error::release build with efre-authn/mock unexpectedly succeeded"
            exit 1
          fi
          grep -q "must never be enabled in a release build" mock-release.log
          # 2. The app's normal/build feature graph (dev-dependencies excluded: tests may use
          #    the mock) must not enable it.
          if cargo tree --locked -p efre -e no-dev,features --target x86_64-pc-windows-msvc | grep -q 'efre-authn feature "mock"'; then
            echo "::error::efre's release dependency graph enables efre-authn/mock"
            exit 1
          fi
          # 3. Backstop: the release binary must not contain the mock's marker string.
          cargo build --release --locked -p efre
          if grep -q -a "EFRE-MOCK-AUTHENTICATOR-MUST-NOT-SHIP" target/release/efre.exe; then
            echo "::error::mock authenticator marker found in release binary"
            exit 1
          fi
          echo "mock exclusion: OK"

  core-portable:
    name: efre-core / efre-authn on Linux (platform independence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked -p efre-core -p efre-authn --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast -p efre-core -p efre-authn

  hardware-check:
    name: Hardware check tool (hardware_check.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: hardware-check-static-crt
      # Static CRT: the .exe runs on a PC without the Visual C++ runtime installed.
      # Debug profile on purpose: the example is built with efre-core's dev-dependencies.
      - name: Build hardware_check.exe
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked -p efre-core --example hardware_check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efre-hardware-check-${{ github.sha }}
          path: target/debug/examples/hardware_check.exe
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    name: Supply chain (cargo-deny, cargo-audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo deny (bans incl. network crates/plugins, licenses, sources, advisories)
        run: cargo deny --locked check
      - name: Linux-only advisory crates are absent from the Windows build
        shell: bash
        run: |
          set -euo pipefail
          # Keep in sync with .cargo/audit.toml.
          for c in glib proc-macro-error zbus zbus_names zvariant zvariant_derive; do
            if cargo tree --locked -p efre --target x86_64-pc-windows-msvc -e all --prefix none -i "$c" 2>/dev/null | grep -q .; then
              echo "::error::$c is in the Windows dependency graph; its audit ignore in .cargo/audit.toml is no longer valid"
              exit 1
            fi
          done
          echo "OK: ignored advisories only affect Linux-only crates"
      - name: cargo audit
        run: cargo audit --deny warnings

  bundle:
    name: Unsigned Windows build (NSIS)
    needs: [frontend, rust, supply-chain]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: tauri build (unsigned)
        run: npm run tauri -- build --ci --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efre-windows-unsigned-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/efre.exe
          if-no-files-found: error
          retention-days: 14
      # The release app starts under the startup hardening, WebView2 comes up in efre's own
      # data folder with efre's browser arguments, the window shows one of efre's screens
      # (so the page and its IPC work), and neither efre.exe nor its WebView2 processes
      # open a socket, not even to loopback (ARCHITECTURE §8.1 and §10). Without
      # webauthn.dll (or with an old one) the app shows its "Update Windows" screen and
      # keeps running, which is all this needs.
      - name: Smoke test (release app starts, shows a screen, zero sockets)
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'target\release\efre.exe'
          $marker = '*\efre\webview*'   # efre's own WebView2 data folder (window.rs)
          $runSeconds = 25
          $problems = [System.Collections.Generic.List[string]]::new()
          $sockets = [System.Collections.Generic.List[string]]::new()
          $owners = @{}

          $wv2Key = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv2 = @("HKLM:\SOFTWARE\WOW6432Node\$wv2Key", "HKCU:\Software\$wv2Key") |
            ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ }
          if ($wv2) { Write-Host "WebView2 runtime: $($wv2 -join ', ')" }
          else { Write-Host '::warning::No WebView2 runtime is registered on this runner' }

          function Get-EfreWebViewProcesses {
            @(Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" |
              Where-Object { $_.CommandLine -like $marker })
          }
          function Get-ProcessKind([string]$commandLine) {
            if ($commandLine -match '--utility-sub-type=(\S+)') { return "utility $($Matches[1])" }
            if ($commandLine -match '--type=(\S+)') { return $Matches[1] }
            return 'browser'
          }

          # The window's screens (src/): one of these headings means the page loaded and
          # app_status went through IPC. "efre couldn't start" means IPC failed.
          $headings = 'Welcome to efre', 'Insert and touch your YubiKey', 'Update Windows to use efre',
            "efre can't open your vault", "efre can't start"
          $startupError = "efre couldn't start"
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $AE = [System.Windows.Automation.AutomationElement]
          function Get-EfreUiNames([int]$processId) {
            $condition = New-Object System.Windows.Automation.PropertyCondition -ArgumentList $AE::ProcessIdProperty, $processId
            $windows = $AE::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, $condition)
            if ($windows.Count -eq 0) { return $null }
            $names = [System.Collections.Generic.List[string]]::new()
            foreach ($window in $windows) {
              $found = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
              foreach ($element in $found) {
                try { $name = $element.Current.Name } catch { $name = $null }
                if ($name) { $names.Add($name) }
              }
            }
            return ,$names
          }

          $efre = Start-Process -FilePath $exe -PassThru
          $null = $efre.Handle   # keeps ExitCode readable after an early exit
          $samples = 0
          $webviewCount = 0
          $imageLoad = $null
          $resolverRules = @{}
          $uiWindow = $false
          $uiNames = @()
          $uiHeading = $null
          $uiNote = $null
          $lastUi = [DateTime]::MinValue
          try {
            $deadline = (Get-Date).AddSeconds($runSeconds)
            while ((Get-Date) -lt $deadline -and -not $efre.HasExited) {
              $webviews = Get-EfreWebViewProcesses
              $webviewCount = [Math]::Max($webviewCount, $webviews.Count)
              foreach ($process in $webviews) {
                $kind = Get-ProcessKind $process.CommandLine
                $owners[[int]$process.ProcessId] = $kind
                $resolverRules[$kind] = $process.CommandLine -like '*--host-resolver-rules=*'
              }
              $ids = @($efre.Id) + @($webviews | ForEach-Object { [int]$_.ProcessId })
              $owners[[int]$efre.Id] = 'efre.exe'
              Get-NetTCPConnection -ErrorAction SilentlyContinue |
                Where-Object { $ids -contains $_.OwningProcess } |
                ForEach-Object { $sockets.Add("TCP $($owners[[int]$_.OwningProcess]) (pid $($_.OwningProcess)) $($_.LocalAddress):$($_.LocalPort) -> $($_.RemoteAddress):$($_.RemotePort) $($_.State)") }
              Get-NetUDPEndpoint -ErrorAction SilentlyContinue |
                Where-Object { $ids -contains $_.OwningProcess } |
                ForEach-Object { $sockets.Add("UDP $($owners[[int]$_.OwningProcess]) (pid $($_.OwningProcess)) $($_.LocalAddress):$($_.LocalPort)") }
              $samples++
              if (-not $uiHeading -and ((Get-Date) - $lastUi).TotalSeconds -ge 2) {
                $lastUi = Get-Date
                try {
                  $names = Get-EfreUiNames $efre.Id
                  if ($null -ne $names) {
                    $uiWindow = $true
                    if ($names.Count -gt 0) { $uiNames = @($names) }
                    $uiHeading = $headings | Where-Object { $h = $_; @($names | Where-Object { $_ -like "*$h*" }).Count -gt 0 } | Select-Object -First 1
                  }
                } catch {
                  $uiNote = "UI Automation error: $_"
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if ($efre.HasExited) {
              $problems.Add("efre.exe exited during the test (exit code $($efre.ExitCode))")
            } else {
              if (Get-Command Get-ProcessMitigation -ErrorAction SilentlyContinue) {
                $imageLoad = (Get-ProcessMitigation -Id $efre.Id).ImageLoad
              }
            }
          } catch {
            $problems.Add("smoke test error: $_")
          } finally {
            Stop-Process -Id $efre.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Get-EfreWebViewProcesses | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

          if ($webviewCount -lt 1) {
            $problems.Add("no msedgewebview2.exe with '\efre\webview' in its command line: WebView2 did not start")
          } elseif (-not $resolverRules['browser']) {
            $problems.Add('the WebView2 browser process did not get --host-resolver-rules (window.rs)')
          }
          if ($sockets.Count -gt 0) {
            $problems.Add("$($sockets.Count) socket observation(s) for efre or its WebView2 processes")
          }
          if (@($uiNames | Where-Object { $_ -like "*$startupError*" }).Count -gt 0) {
            $problems.Add("the window shows '$startupError': its IPC failed")
          } elseif (-not $uiHeading) {
            $why = if ($uiNote) { $uiNote } elseif (-not $uiWindow) { 'UI Automation did not find the window' } else { "UI Automation saw: $(($uiNames | Select-Object -First 12) -join ' | ')" }
            Write-Host "::warning::no efre screen heading was confirmed. $why"
          }
          # Image-load policy (hardening.rs): fail only on an explicit OFF, so a different
          # cmdlet output format is a warning rather than a false failure.
          $policy = 'not checked (Get-ProcessMitigation unavailable)'
          if ($imageLoad) {
            $policy = 'BlockRemoteImageLoads', 'BlockLowLabelImageLoads', 'PreferSystem32' |
              ForEach-Object {
                $value = "$($imageLoad.$_)"
                if ($value -eq 'OFF') { $problems.Add("image-load policy ${_} is OFF") }
                elseif ($value -ne 'ON') { Write-Host "::warning::image-load policy ${_}: '$value'" }
                "${_}=$value"
              }
            $policy = $policy -join ', '
          }
          # WerAddExcludedApplication(efre.exe, FALSE) writes this per-user value.
          $werKey = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\ExcludedApplications'
          $wer = $null -ne (Get-ItemProperty -Path $werKey -Name 'efre.exe' -ErrorAction SilentlyContinue)
          if (-not $wer) { $problems.Add('efre.exe is not in the per-user WER ExcludedApplications list') }

          Write-Host '--- efre smoke test ---'
          Write-Host "efre.exe pid:            $($efre.Id), ran for $runSeconds s"
          Write-Host "WebView2 processes:      $webviewCount (command line contains \efre\webview)"
          Write-Host "  kinds:                 $(($owners.Values | Sort-Object -Unique) -join ', ')"
          Write-Host "  --host-resolver-rules: $(($resolverRules.GetEnumerator() | Sort-Object Name | ForEach-Object { "$($_.Name)=$($_.Value)" }) -join ', ')"
          Write-Host "screen heading (UIA):    $(if ($uiHeading) { $uiHeading } else { 'not confirmed' })"
          Write-Host "network samples:         $samples, socket observations: $($sockets.Count)"
          $sockets | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }
          if ($sockets.Count -gt 0) {
            Get-NetTCPConnection -State Listen -LocalPort 80, 443 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  listener $($_.LocalAddress):$($_.LocalPort) pid $($_.OwningProcess) $((Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName)" }
          }
          Write-Host "image-load policy:       $policy"
          Write-Host "WER exclusion (HKCU):    $wer"
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host 'smoke test: OK'
      # The per-user installer puts efre in %LOCALAPPDATA%\Programs\efre, never in the vault
      # folder, and uninstalling leaves the vault folder alone (ARCHITECTURE §9).
      - name: Installer location and uninstall keep the vault folder intact
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $problems = [System.Collections.Generic.List[string]]::new()
          function Invoke-Waited($file, [string[]]$arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(180000)) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$file did not finish within 3 minutes"
            }
            return $p.ExitCode
          }
          $setup = @(Get-ChildItem 'target\release\bundle\nsis\*-setup.exe')
          if ($setup.Count -ne 1) { throw "expected one NSIS installer, found $($setup.Count)" }
          $vaultDir = Join-Path $env:LOCALAPPDATA 'efre'
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\efre'
          $werKey = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\ExcludedApplications'

          # A stand-in vault: these bytes must survive install and uninstall unchanged.
          New-Item -ItemType Directory -Force -Path $vaultDir | Out-Null
          $sentinel = Join-Path $vaultDir 'vault.efre'
          [IO.File]::WriteAllBytes($sentinel, [byte[]](1..255))
          $hash = (Get-FileHash $sentinel).Hash

          $code = Invoke-Waited $setup[0].FullName @('/S')
          if ($code -ne 0) { $problems.Add("silent install exited with $code") }
          if (-not (Test-Path (Join-Path $installDir 'efre.exe'))) { $problems.Add("efre.exe is not in $installDir") }
          foreach ($file in 'efre.exe', 'uninstall.exe') {
            if (Test-Path (Join-Path $vaultDir $file)) { $problems.Add("$file was installed into the vault folder") }
          }
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\efre'
          $location = (Get-ItemProperty -Path $uninstallKey -ErrorAction SilentlyContinue).InstallLocation
          Write-Host "registered install location: $location"
          if ("$location".Trim('"') -ne $installDir) { $problems.Add("InstallLocation is '$location'") }

          # `_?=` runs the uninstaller in place, so waiting for it covers the whole uninstall.
          $uninstaller = Join-Path $installDir 'uninstall.exe'
          if (Test-Path $uninstaller) {
            $code = Invoke-Waited $uninstaller @('/S', "_?=$installDir")
            if ($code -ne 0) { $problems.Add("silent uninstall exited with $code") }
            if (Test-Path (Join-Path $installDir 'efre.exe')) { $problems.Add('the uninstaller left efre.exe') }
            if (Test-Path $uninstallKey) { $problems.Add('the uninstall registry key is still there') }
            if ($null -ne (Get-ItemProperty -Path $werKey -Name 'efre.exe' -ErrorAction SilentlyContinue)) {
              $problems.Add('the uninstaller left the WER exclusion value')
            }
          }
          if (-not (Test-Path $sentinel)) { $problems.Add('the vault file is gone') }
          elseif ((Get-FileHash $sentinel).Hash -ne $hash) { $problems.Add('the vault file changed') }
          if (-not (Test-Path (Join-Path $vaultDir 'webview'))) { $problems.Add("the smoke test's webview folder is gone") }

          Remove-Item -Recurse -Force $installDir -ErrorAction SilentlyContinue
          Remove-Item -Force $sentinel -ErrorAction SilentlyContinue
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }
          Write-Host "installer: OK (installed to $installDir; vault folder untouched)"
